[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "data-analysis-automation-backend"
version = "0.1.0"
description = "Backend for data analysis automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.36",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "pandas>=2.2.3",
  "numpy>=2.2.1",
  "openpyxl>=3.1.5",
  "xlrd>=2.0.1",
  "scipy>=1.14.1",
  "matplotlib>=3.10.0",
  "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "httpx>=0.28.1",
  "ruff>=0.8.4",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
